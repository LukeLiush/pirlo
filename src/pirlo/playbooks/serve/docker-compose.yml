services:
  prefect:
    image: prefecthq/prefect:3-python3.12
    container_name: pirlo-prefect-server
    restart: unless-stopped
    command: prefect server start --host 0.0.0.0 --port 4200
    environment:
      - PREFECT_UI_API_URL=/api
    ports:
      - "${PREFECT_PORT:-4200}:4200"
    volumes:
      - prefect_data:/root/.prefect

  prefect-worker:
    image: prefecthq/prefect:3-python3.12
    container_name: pirlo-prefect-worker
    restart: unless-stopped
    command: >
      sh -c "prefect work-pool create $${PREFECT_WORK_POOL:-pirlo-pool} --type process &&
             prefect worker start --pool $${PREFECT_WORK_POOL:-pirlo-pool}"
    environment:
      - PREFECT_API_URL=http://prefect:4200/api
      - PREFECT_WORK_POOL=${PREFECT_WORK_POOL:-pirlo-pool}
    depends_on:
      - prefect

  ollama:
    image: ollama/ollama:latest
    container_name: pirlo-ollama-server
    restart: unless-stopped
    ports:
      - "${OLLAMA_PORT:-11434}:11434"
    volumes:
      - ollama_data:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 3s
      timeout: 5s
      retries: 10

volumes:
  prefect_data:
  ollama_data:
