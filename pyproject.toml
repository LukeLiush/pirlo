[project]
name = "pirlo"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"

dependencies = [
    "browser-use>=0.13.6",
    "cloakbrowser>=0.5.5",
    "duckduckgo-search>=7.5.0",
    "ftfy>=6.3.1",
    "html2text>=2024.2.26",
    "httpx>=0.28.1",
    "langchain-core>=1.5.1",
    "langchain-openai>=1.1.9",
    "litellm>=1.40.0",
    "ollama>=0.4.0",
    "openai>=2.16.0",
    "playwright>=1.61.0",
    "prefect>=3.0.0",
    "pydantic>=2.12.5",
    "pydantic-ai>=0.0.35",
    "typing-extensions>=4.15.0",
]

[project.scripts]
pirlo = "pirlo.infrastructure.adapters.cli.entrypoint:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "mypy>=2.3.0",
    "pytest>=9.1.1",
    "ruff>=0.16.0",
]

[tool.mypy]
exclude = ["^tests/"]
ignore_missing_imports = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false
disallow_incomplete_defs = false
check_untyped_defs = false
