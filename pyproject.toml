[project]
name = "pirlo"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"

dependencies = [
    "browser-use>=0.13.6",
    "cloakbrowser>=0.5.5",
    "duckduckgo-search>=7.5.0",
    "ftfy>=6.3.1",
    "httpx>=0.28.1",
    "langchain-core>=1.5.1",
    "langchain-openai>=1.1.9",
    "ollama>=0.4.0",
    "openai>=2.16.0",
    "playwright>=1.61.0",
    "prefect>=3.0.0",
    "pydantic>=2.12.5",
    "pydantic-ai>=0.0.35",
    "typing-extensions>=4.15.0",
]

[project.scripts]
pirlo = "pirlo.infrastructure.adapters.cli.entrypoint:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "mypy>=2.3.0",
    "pytest>=9.1.1",
    "ruff>=0.16.0",
]

[tool.mypy]
ignore_missing_imports = true

[tool.pirlo.playbooks]
dummy = "pirlo.playbooks.dummy:DummySession"
autopass = "pirlo.playbooks.autopass.main:AutopassSession"
login = "pirlo.playbooks.login:LoginSession"

