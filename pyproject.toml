[project]
name = "pirlo"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"

dependencies = [
    "browser-use>=0.13.6",
    "cloakbrowser>=0.5.2",
    "httpx>=0.28.1",
    "langchain-core>=1.5.1",
    "langchain-openai>=1.1.9",
    "openai>=2.16.0",
    "playwright>=1.61.0",
    "pydantic>=2.12.5",
    "typing-extensions>=4.15.0",
]

[project.scripts]
pirlo = "pirlo.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "mypy>=2.3.0",
    "pytest>=9.1.1",
    "ruff>=0.16.0",
]

[tool.mypy]
ignore_missing_imports = true

[tool.pirlo.playbooks]
dummy = "pirlo.playbooks.dummy:DummySession"
autopass = "pirlo.playbooks.autopass.main:AutopassSession"

